<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Astro Hang</title>
  <desc id="desc">Default social sharing image for the Astro Hang blog template.</desc>
  <rect width="1200" height="630" fill="#f8f9fa"/>
  <g fill="#e9ecef">
    <rect x="200" y="400" width="800" height="6" rx="3"/>
    <rect x="200" y="440" width="600" height="6" rx="3"/>
    <rect x="200" y="480" width="400" height="6" rx="3"/>
  </g>
  <text x="600" y="250"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="88"
    font-weight="900"
    text-anchor="middle"
    fill="#212529">
    Astro Hang
  </text>
  <text x="600" y="320"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="30"
    font-weight="300"
    letter-spacing="2"
    fill="#495057"
    text-anchor="middle">
    Bilingual blog template with hanging media
  </text>
  <g opacity="0.08" fill="#000">
    <text x="120" y="100" font-size="42" font-family="monospace" font-weight="bold">ASTRO</text>
    <text x="944" y="540" font-size="42" font-family="monospace" font-weight="bold">HANG</text>
  </g>
</svg>
